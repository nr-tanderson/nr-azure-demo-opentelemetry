name: Destroy AKS infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY-NR-AKS-DEMO to confirm permanent teardown
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-observability-demo-infrastructure
  cancel-in-progress: false

jobs:
  destroy:
    uses: ./.github/workflows/lab-infrastructure.yml
    with:
      operation: destroy
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit