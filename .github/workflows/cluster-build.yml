name: Build AKS infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region
        required: true
        default: eastus
        type: string
      name_prefix:
        description: Lowercase resource-name prefix
        required: true
        default: nrobsdemo
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-observability-demo-infrastructure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_OBJECT_ID: ${{ vars.AZURE_CLIENT_OBJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Initialize Terraform backend
        run: bash scripts/init-terraform.sh
      - name: Apply infrastructure
        env:
          LOCATION: ${{ inputs.location }}
          NAME_PREFIX: ${{ inputs.name_prefix }}
        run: |
          : "${AZURE_CLIENT_OBJECT_ID:?Set the AZURE_CLIENT_OBJECT_ID repository variable}"
          terraform -chdir=infra apply -input=false -auto-approve \
            -var="location=${LOCATION}" \
            -var="name_prefix=${NAME_PREFIX}" \
            -var="github_actions_principal_object_id=${AZURE_CLIENT_OBJECT_ID}"
      - name: Show created cluster
        run: |
          terraform -chdir=infra output -raw resource_group_name
          terraform -chdir=infra output -raw cluster_name