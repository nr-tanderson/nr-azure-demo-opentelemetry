name: Build AKS infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region
        required: true
        default: eastus
        type: string
      name_prefix:
        description: Lowercase resource-name prefix
        required: true
        default: nrobsdemo
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-observability-demo-infrastructure
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/lab-infrastructure.yml
    with:
      operation: build
      location: ${{ inputs.location }}
      name_prefix: ${{ inputs.name_prefix }}
    secrets: inherit